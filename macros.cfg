[gcode_macro G29]
gcode:
    BED_MESH_CALIBRATE

[gcode_macro M600]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PLAY
    PAUSE
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-10 F1000
    RESTORE_GCODE_STATE NAME=M600_state

[gcode_macro M300]
gcode:
    {% set S = params.S|default(2000)|int %} ; S sets the tone frequency
    {% set P = params.P|default(200)|int %} ; P sets the tone duration
    {% set L = 0.5 %} ; L varies the PWM on time, close to 0 or 1 the tone gets a bit quieter. 0.5 is a symmetric waveform
    {% if S <= 0 %} ; dont divide through zero
        {% set F = 1 %}
        {% set L = 0 %}
    {% elif S >= 10000 %} ;max frequency set to 10kHz
        {% set F = 0 %}
    {% else %}
        {% set F = 1/S %} ;convert frequency to seconds
    {% endif %}
    SET_PIN PIN=beeper VALUE={L} CYCLE_TIME={F} ;Play tone
    G4 P{P} ;tone duration
    SET_PIN PIN=beeper VALUE=0

[gcode_macro BEEP]
gcode:
    {% set N = params.N|default(1)|int %} ; N set number of beeps 
    {% set W = params.W|default(100)|int %} ; W set wait time between beeps 
    {% for i in range(N) %}
        M300
        G4 P{W}
    {% endfor %}

[gcode_macro PLAY]
gcode:
    {% set tones = [1000, 1500, 2000, 2500, 3000, 2500, 2000, 1500, 1000] %} ; S sets the tone frequency
    {% for count in tones %}
      {% set cytime = 1 / count %}
      SET_PIN PIN=beeper VALUE={0.5} CYCLE_TIME={cytime} ;Play tone
      G4 P50 ;tone duration
      SET_PIN PIN=beeper VALUE=0
    {% endfor %}

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
    # Reset the G-Code Z offset (adjust Z offset if needed)
    SET_GCODE_OFFSET Z=0.020
    # Start bed and extruder heating
    M140 S{BED_TEMP}
    M104 S160
    # Home the printer
    G28
    #Wait for heating
    M190 S{BED_TEMP}
    M109 S160
    #Move to start pos
    G1 X0 Y0 F3000
    #Wait for final heating
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    #Intro line
    G1 Z0.2 F1000
    G92 E0.0
    G1 X100.0 E15 F1000.0
    G92 E0.0

[gcode_macro END_PRINT]
gcode:
    # Turn off bed, extruder, and fan
    M140 S0
    M104 S0
    M106 S0
    # Move nozzle away from print while retracting
    G91
    G1 X-2 Y-2 E-2 F300
    # Raise nozzle by 10mm and present print
    G1 Z10 F3000
    G90
    G1 X10 Y210 F3000
    # Disable steppers
    M84

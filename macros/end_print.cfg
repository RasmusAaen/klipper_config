[gcode_macro END_PRINT]
gcode:
    # Turn off bed, extruder, and fan
    M140 S0
    M104 S0
    M106 S0
    # Move nozzle away from print while retracting
    G91
    G1 X-2 Y-2 E-1 F300
    # Lower bed to park height
    PARK_BED
    # Clear mesh and z adjustments
    BED_MESH_CLEAR
    # Disable steppers
    M84

